<header class="site-header">
  <div class="wrap site-header-inner">

    <p class="brand">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </p>

    <nav class="nav" aria-label="Primary">
      <ul class="nav-list">
        {%- assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" -%}
        {%- for item in nav_pages %}
        <li class="nav-item">
          <a class="nav-link{% if page.url == item.url %} is-current{% endif %}"
             href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.nav_title | default: item.title }}</a>
        </li>
        {%- endfor %}
      </ul>
    </nav>

  </div>
</header>
